{% load static %}

<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Probando Tailwind CSS</title>
        <link href="{% static 'css/output.css' %}" rel="stylesheet" />
    </head>
    <body class="bg-gray-900">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div
                class="max-w-2xl w-full bg-gradient-to-br from-purple-600 via-blue-500 to-indigo-700 rounded-2xl shadow-2xl p-8 md:p-12 text-center text-white transform hover:-translate-y-2 transition-transform duration-500 ease-in-out"
            >
                <div class="mb-6">
                    <svg
                        class="w-16 h-16 mx-auto text-white opacity-80"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2 1m2-1l-2-1m2 1v2.5M3 12l2 1m-2-1l2-1m-2 1v2.5M21 12l-2 1m2-1l-2-1m2 1v2.5M5 16l-2 1m2-1l-2-1m2 1v2.5M19 16l-2 1m2-1l-2-1m2 1v2.5m-4-11l-2 1m2-1l-2-1m2 1V7.5M10 19l-2 1m2-1l-2-1m2 1v-2.5m4 0l2-1m-2 1l2 1m-2-1v-2.5"
                        ></path>
                    </svg>
                </div>

                <h1
                    class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight"
                >
                    ¡La Integración Funciona!
                </h1>

                <p
                    class="text-lg md:text-xl text-indigo-200 mb-8 max-w-lg mx-auto"
                >
                    Si ves gradientes, sombras, y este botón tiene un efecto
                    genial, tu pipeline de Django y Tailwind CSS está
                    perfectamente configurado.
                </p>

                <a
                    href="#"
                    class="inline-block bg-white text-indigo-600 font-bold py-3 px-8 rounded-full shadow-lg transform transition-all duration-300 ease-in-out hover:bg-indigo-100 hover:scale-110 hover:shadow-2xl"
                >
                    Comenzar a Construir
                </a>
            </div>
        </div>
    </body>
</html>
